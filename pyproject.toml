[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaoptima-dphm-pinn"
version = "0.1.0"
description = "Differentiable Pressurised Hydraulic Model (dPHM) PINN primitives for AquaOptima."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
pyg = [
    "torch-geometric>=2.7",
]
epanet = [
    "wntr>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aquaoptima*", "aquaoptima_contracts*"]

[tool.setuptools.package-data]
aquaoptima_contracts = [
    "fixtures/phase1_shadow/*.json",
    "fixtures/phase1_shadow/*.csv",
    "fixtures/phase1_shadow/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
