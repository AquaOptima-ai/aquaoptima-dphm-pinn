# AOPSO Sprint 24 -- dPHM TCN training hyperparameters (Yilan 2025 v1).
#
# DIMENSION NOTE: n_features / n_axes are NOT set here. They are derived at
# runtime from the normalization stats' active-axis set (8 active axes for
# Yilan 2025), per the Sprint 23 data contract. The roadmap's "11 features"
# guess does not match reality (edge_valve_position has 0% coverage).
#
# Safety: offline training only; .pt state_dict checkpoints; no ONNX; no edge.

model:
  channels: 32       # TCN hidden channel width
  kernel_size: 3
  dropout: 0.0

data:
  window: 10         # input window length (timesteps)
  horizon: 1         # next-step prediction
  stride: 1

train:
  lr: 0.001
  batch_size: 128
  epochs: 50
  weight_decay: 0.0001
  optimizer: adamw
  scheduler:
    name: reduce_lr_on_plateau
    patience: 5
    factor: 0.5
  early_stopping:
    patience: 10
    monitor: val_loss

loss:
  # Per-axis weights default to 1.0. Binary axes (node_status, edge_status)
  # are routed to BCEWithLogits; the other 6 active axes to MSE.
  default_weight: 1.0

seed:
  torch_seed: 42
  numpy_seed: 42
  random_seed: 42

# AOPSO Sprint 25 -- offline-evaluation acceptance gate ("good enough to
# package"). These are the contractually-encoded packaging thresholds, NOT
# illustrative example numbers. The evaluation harness reads this block; a FAIL
# blocks Sprint 26 packaging. Scorecards are advisory evidence only.
eval:
  # Per active CONTINUOUS axis (normalized): both must hold.
  continuous_mse_max: 0.15
  continuous_mae_max: 0.30
  # Per BINARY axis (node_status, edge_status).
  binary_accuracy_min: 0.95
  # dPHM must beat the MVP-v1 persistence baseline (lower MSE) on at least this
  # many of the 6 continuous axes.
  beats_baseline_min: 5
  n_continuous_axes: 6
  # The 2026 benchmark CSV (read-only). Overridable via $YILAN_2026_CSV or the
  # --march-csv CLI flag. Filtered to calendar month March (2026-03).
  march_csv: /home/hunter_lin/projects/yilan-site-model-testing/yearlong_drive/source1_2026.csv
